<head>
  <meta charset="utf-8">

  <link rel="icon" href="/assets/github-avatar.jpg" type="image/jpeg">
  <link rel="stylesheet" href="/styles.css?v=20261023-9">
  <script>
    (() => {
      let savedTheme = null;
      try {
        savedTheme = localStorage.getItem("theme");
      } catch {}
      document.documentElement.dataset.theme =
        savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
    })();
  </script>
